services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportdesk_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-supportdesk}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - supportdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-supportdesk_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-supportdesk_test_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-supportdesk_test}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - supportdesk_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  supportdesk_postgres_data:
  supportdesk_postgres_test_data:
